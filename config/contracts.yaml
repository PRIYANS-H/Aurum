# AURUM contract specifications
#
# RULES FOR THIS FILE
# - Every field that feeds a calculation carries `status` and `source`.
#   status: VERIFIED   -> read in the official MCX contract-specification PDF named in `source`
#           SECONDARY  -> broker / third-party page or an older copied document
#           ASSUMED    -> our working assumption; no source confirms it
# - MCX specifications apply to CONTRACT SERIES ("July 2026 contract onwards"), so each version's
#   `applies_from_expiry` is compared with the CONTRACT'S EXPIRY DATE, not the trading date.
# - Official PDFs are stored in docs/specs/ (downloaded by the user from mcxindia.com, 2026-10-23).

sources:
  mcx_gold_feb2027:
    title: "MCX - Contract Specifications of Gold Futures (February 2027 contract onwards)"
    file: "docs/specs/gold-february-2027-contract-onwards.pdf"
    url: "https://www.mcxindia.com/products/bullion/gold"
    accessed: "2026-10-23"
